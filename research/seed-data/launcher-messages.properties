# L2Everdream launcher — ENGLISH (the base bundle, and the fallback for every other language).
#
# This file is the COPY, not just data: it is the voice a player reads. Keep it plain, warm and
# honest — say what is true and what to do about it, never hype and never blame.
#
# ⚠️ PROPER NOUNS ARE NOT TRANSLATED in any bundle: class, zone, town and chronicle names stay as
# they are. "L2Everdream", "Lineage 2" and "Interlude" are names, not words.
#
# ⚠️ %s placeholders are substituted through the TRANSLATED template, left to right, so a
# translation is free to REORDER them. Never assume source order.
#
# The keys are declared in org.l2sp.launcher.i18n.MessageKeys; a coverage test asserts every
# bundle defines every one of them.

# --- PLAY: the honesty line beside the button -----------------------------------------------
